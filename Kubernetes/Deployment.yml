apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-notes-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-notes
  template:
    metadata:
      labels:
        app: django-notes
    spec:
      containers:
        - name: django-notes
          image: 043661318279.dkr.ecr.ap-south-1.amazonaws.com/jenkins-argo:15
          ports:
            - containerPort: 8000
